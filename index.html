<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Password</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }

    h1 {
      color: #333;
    }

    p {
      font-size: 1.2em;
      color: #666;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <h1>Create Password</h1>
  <p>Click the button below to continue.</p>

  <button id="createPasswordBtn">
    Create Password
  </button>

 <script>
  document
    .getElementById("createPasswordBtn")
    .addEventListener("click", function () {

      const payload = JSON.stringify({
        action: "CREATE_ATTEMPT_PASSWORD",
        timestamp: Date.now()
      });

      if (
        window.NativeBridge &&
        window.NativeBridge.createPasswordAttempt
      ) {
        window.NativeBridge.createPasswordAttempt(payload);
      } else {
        console.log("NativeBridge not available");
      }
    });
</script>
</body>
</html>
