<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Password</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }

    h1 {
      color: #333;
    }

    p {
      font-size: 1.2em;
      color: #666;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <h1>Create Password</h1>
  <p>Click the button below to continue.</p>

  <button id="createPasswordBtn">
    Create Password
  </button>

  <script>
    document
      .getElementById("createPasswordBtn")
      .addEventListener("click", function () {

        // Trigger custom JS event
        const event = new CustomEvent("CREATE_ATTEMPT_PASSWORD", {
          detail: {
            timestamp: Date.now()
          }
        });

        window.dispatchEvent(event);

        console.log("CREATE_ATTEMPT_PASSWORD event triggered");
      });

    // Example listener (optional)
    window.addEventListener(
      "CREATE_ATTEMPT_PASSWORD",
      function (event) {
        console.log("Received event:", event.detail);
      }
    );
  </script>
</body>
</html>
